server.port=8081

spring.application.name=shambanexa
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shambanexa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.jackson.serialization.write-dates-as-timestamps=false

shambanexa.jwt.secret=${JWT_SECRET:shambanexa-dev-secret-change-before-any-shared-deployment-32}
shambanexa.jwt.expiration-minutes=720
shambanexa.cors.origins=${CORS_ORIGINS:http://localhost:60575}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

logging.pattern.console=%d{HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n
